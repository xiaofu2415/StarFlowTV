name: Dispatch StarFlowTV v1.4.7 production OTA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-v147.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted production signing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-signing.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_ref]=main'
