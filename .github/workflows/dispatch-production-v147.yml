name: Dispatch StarFlowTV v1.4.10 production OTA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-v147.yml
      - .github/workflows/production-signing.yml
      - app/build.gradle
      - app/src/main/java/com/github/tvbox/osc/official/OfficialLiveCatalog.java
      - app/src/main/java/com/github/tvbox/osc/official/OfficialLiveUrlPolicy.java
      - app/src/main/java/com/github/tvbox/osc/official/OfficialLiveQualityPreference.java
      - app/src/main/java/com/github/tvbox/osc/ui/official/OfficialLiveWebViewController.java
      - app/src/main/java/com/github/tvbox/osc/update/StarFlowUpdateManager.java
      - app/src/main/java/com/github/tvbox/osc/update/ApkDownloadProgress.java
      - app/src/main/assets/official_live_fullscreen.js

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted production signing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-signing.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_ref]=main' \
            -f 'inputs[release_notes]=官方直播先自适应呈现首帧，播放稳定后逐档提升画质，卡顿时回退以减少换台等待；OTA 下载显示进度、文件大小和校验状态。普通 IPTV 播放与换台逻辑保持原样。'
