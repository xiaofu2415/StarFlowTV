name: Dispatch StarFlowTV v1.4.9 production OTA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-v147.yml
      - .github/workflows/production-signing.yml
      - app/build.gradle
      - app/src/main/java/com/github/tvbox/osc/official/OfficialLiveCatalog.java
      - app/src/main/java/com/github/tvbox/osc/official/OfficialLiveUrlPolicy.java

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted production signing workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-signing.yml/dispatches" \
            -f ref=main \
            -f 'inputs[release_ref]=main' \
            -f 'inputs[release_notes]=修复 CCTV-6、CCTV-7、CCTV-8、CCTV-9 官方直播兼容性：放行央视 cctv.cn 官方资源域名，并将 CCTV-9 切换到移动直播页。'
