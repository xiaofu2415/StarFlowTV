name: Production signing (manual)

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "main or a v* release tag already merged into main"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: starflowtv-production-signing
  cancel-in-progress: false

jobs:
  sign:
    # Start from trusted main and verify the requested release ref before using its code.
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve, verify, and checkout protected release commit
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            main|refs/heads/main)
              NORMALIZED_REF='refs/heads/main'
              REF_KIND='branch'
              ;;
            v*)
              NORMALIZED_REF="refs/tags/$RELEASE_REF"
              REF_KIND='tag'
              ;;
            refs/tags/v*)
              NORMALIZED_REF="$RELEASE_REF"
              REF_KIND='tag'
              ;;
            *)
              echo 'release_ref must be main, refs/heads/main, v*, or refs/tags/v*'
              exit 1
              ;;
          esac
          git check-ref-format "$NORMALIZED_REF"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 --wrap=0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$REF_KIND" = 'tag' ]; then
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags origin "+$NORMALIZED_REF:refs/starflow/verified-release"
            EXPECTED_SHA="$(git rev-parse 'refs/starflow/verified-release^{commit}')"
          else
            EXPECTED_SHA="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          fi
          unset FETCH_TOKEN AUTH_HEADER
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK path
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_B64 }}
          STARFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_PASSWORD }}
          STARFLOW_ANDROID_KEY_ALIAS: ${{ secrets.STARFLOW_ANDROID_KEY_ALIAS }}
          STARFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'STARFLOW_ANDROID_KEYSTORE_B64 is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEYSTORE_PASSWORD" || { echo 'keystore password is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEY_ALIAS" || { echo 'key alias is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEY_PASSWORD" || { echo 'key password is not configured'; exit 1; }

      - name: Build unsigned release candidates
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJavaRelease :app:assembleJava32Release :app:assembleJava64Release --stacktrace

      - name: Sign and verify three ABI APKs
        env:
          KEYSTORE_B64: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_B64 }}
          STARFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_PASSWORD }}
          STARFLOW_ANDROID_KEY_ALIAS: ${{ secrets.STARFLOW_ANDROID_KEY_ALIAS }}
          STARFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$work/release.keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$zipalign"
          test -x "$aapt"
          out="$GITHUB_WORKSPACE/signed-apks"
          install -d -m 0700 "$out"
          version_name="$(basename "$(find app/build/outputs/apk/java32/release -maxdepth 1 -type f -name 'StarFlowTV-*-java32-release.apk' | sort | tail -1)" | sed -E 's/^StarFlowTV-(.*)-java32-release\.apk$/\1/')"
          test -n "$version_name"
          declare -A inputs=(
            [armeabi-v7a]="app/build/outputs/apk/java32/release/StarFlowTV-$version_name-java32-release.apk"
            [arm64-v8a]="app/build/outputs/apk/java64/release/StarFlowTV-$version_name-java64-release.apk"
            [universal]="app/build/outputs/apk/java/release/StarFlowTV-$version_name-java-release.apk"
          )
          for abi in armeabi-v7a arm64-v8a universal; do
            input="${inputs[$abi]}"
            aligned="$work/$abi-aligned.apk"
            target="$out/StarFlowTV-$version_name-$abi.apk"
            test -s "$input"
            "$zipalign" -f 4 "$input" "$aligned"
            "$apksigner" sign --ks "$work/release.keystore" --ks-key-alias "$STARFLOW_ANDROID_KEY_ALIAS" \
              --ks-pass env:STARFLOW_ANDROID_KEYSTORE_PASSWORD --key-pass env:STARFLOW_ANDROID_KEY_PASSWORD \
              --out "$target" "$aligned"
            "$apksigner" verify --verbose "$target"
            "$aapt" dump badging "$target" | grep -F "package: name='tv.starflow.player'"
            "$apksigner" verify --print-certs "$target" | tee "$out/$abi-certificates.txt"
          done
          (cd "$out" && sha256sum StarFlowTV-*.apk > SHA256SUMS)

      - name: Upload signed APKs and public certificate metadata
        uses: actions/upload-artifact@v4
        with:
          name: starflowtv-production-signed-${{ github.run_number }}
          retention-days: 14
          path: signed-apks/

      - name: State the remaining manifest-signing gate
        run: |
          echo 'APK signing completed only when all preceding steps pass.'
          echo 'Generate manifest.sig/latest.sig in the protected source-release job before publishing latest.json.'
