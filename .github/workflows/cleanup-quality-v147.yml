name: Finalize official quality v1.4.7

on:
  push:
    branches:
      - feat/official-quality-v147
    paths:
      - .github/workflows/cleanup-quality-v147.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-quality-v147

      - name: Apply cleanup
        run: python3 scripts/finalize_official_quality_v147.py

      - name: Verify cleanup
        run: |
          node --test app/src/test/js/official-live-fullscreen.test.js
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name 'starflow-quality-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/github/tvbox/osc/ui/activity/LivePlayActivity.java app/src/test/js/official-live-fullscreen.test.js
          git commit -m 'test: cover official resolution reporting'
          git push origin HEAD:feat/official-quality-v147
