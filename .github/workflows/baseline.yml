name: Android Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/starflowtv-foundation
      - feat/distribution-protocol-v1
    paths-ignore:
      - .github/workflows/bootstrap.yml
      - docs/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**

concurrency:
  group: android-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build Java APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK path
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Test and build universal, 32-bit, and 64-bit debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:testJava32DebugUnitTest :app:assembleJavaDebug :app:assembleJava32Debug :app:assembleJava64Debug --stacktrace

      - name: Verify StarFlowTV APK names
        run: |
          version_name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$version_name"
          test -f "app/build/outputs/apk/java/debug/StarFlowTV-${version_name}-java-debug.apk"
          test -f "app/build/outputs/apk/java32/debug/StarFlowTV-${version_name}-java32-debug.apk"
          test -f "app/build/outputs/apk/java64/debug/StarFlowTV-${version_name}-java64-debug.apk"

      - name: Upload APKs and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starflowtv-baseline-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
