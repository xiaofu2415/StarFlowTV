name: Bootstrap StarFlowTV

on:
  push:
    paths:
      - bootstrap.patch

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout bootstrap files
        uses: actions/checkout@v4
        with:
          path: seed

      - name: Clone pinned TVBoxOS baseline
        run: |
          git clone --no-checkout https://github.com/q215613905/TVBoxOS.git working
          git -C working checkout -B main ccc25f67ce35c6699529d493177c737be3ad4ba4

      - name: Apply StarFlowTV foundation
        run: |
          cd working
          git apply ../seed/bootstrap.patch
          rm -f .github/workflows/test.yml .github/workflows/TVBoxOSC.jks
          mkdir -p .github/workflows
          cp ../seed/.github/workflows/bootstrap.yml .github/workflows/bootstrap.yml
          git config user.name "StarFlowTV Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize StarFlowTV foundation"

      - name: Publish main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git -C working remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C working push --force origin main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK path
        working-directory: working
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build baseline APKs
        working-directory: working
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJava32Debug :app:assembleJava64Debug --stacktrace

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starflowtv-bootstrap-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            working/app/build/outputs/apk/**/*.apk
            working/app/build/reports/**
