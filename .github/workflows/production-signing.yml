name: Production signing (manual)

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "main or a v* release tag already merged into main"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: starflowtv-production-signing
  cancel-in-progress: false

jobs:
  sign:
    # Start from trusted main and verify the requested release ref before using its code.
    runs-on: ubuntu-latest
    environment: production-signing
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve, verify, and checkout protected release commit
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            main|refs/heads/main)
              NORMALIZED_REF='refs/heads/main'
              REF_KIND='branch'
              ;;
            v*)
              NORMALIZED_REF="refs/tags/$RELEASE_REF"
              REF_KIND='tag'
              ;;
            refs/tags/v*)
              NORMALIZED_REF="$RELEASE_REF"
              REF_KIND='tag'
              ;;
            *)
              echo 'release_ref must be main, refs/heads/main, v*, or refs/tags/v*'
              exit 1
              ;;
          esac
          git check-ref-format "$NORMALIZED_REF"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 --wrap=0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$REF_KIND" = 'tag' ]; then
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags origin "+$NORMALIZED_REF:refs/starflow/verified-release"
            EXPECTED_SHA="$(git rev-parse 'refs/starflow/verified-release^{commit}')"
          else
            EXPECTED_SHA="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          fi
          unset FETCH_TOKEN AUTH_HEADER
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'expected_sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK path
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_B64 }}
          STARFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_PASSWORD }}
          STARFLOW_ANDROID_KEY_ALIAS: ${{ secrets.STARFLOW_ANDROID_KEY_ALIAS }}
          STARFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEY_PASSWORD }}
          STARFLOW_ED25519_PRIVATE_KEY_B64: ${{ secrets.STARFLOW_ED25519_PRIVATE_KEY_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'STARFLOW_ANDROID_KEYSTORE_B64 is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEYSTORE_PASSWORD" || { echo 'keystore password is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEY_ALIAS" || { echo 'key alias is not configured'; exit 1; }
          test -n "$STARFLOW_ANDROID_KEY_PASSWORD" || { echo 'key password is not configured'; exit 1; }
          test -n "$STARFLOW_ED25519_PRIVATE_KEY_B64" || { echo 'STARFLOW_ED25519_PRIVATE_KEY_B64 is not configured'; exit 1; }

      - name: Build unsigned release candidates
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJavaRelease :app:assembleJava32Release :app:assembleJava64Release --stacktrace

      - name: Sign and verify three ABI APKs
        env:
          KEYSTORE_B64: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_B64 }}
          STARFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEYSTORE_PASSWORD }}
          STARFLOW_ANDROID_KEY_ALIAS: ${{ secrets.STARFLOW_ANDROID_KEY_ALIAS }}
          STARFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.STARFLOW_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$work/release.keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$zipalign"
          test -x "$aapt"
          out="$GITHUB_WORKSPACE/signed-apks"
          install -d -m 0700 "$out"
          version_name="$(basename "$(find app/build/outputs/apk/java32/release -maxdepth 1 -type f -name 'StarFlowTV-*-java32-release.apk' | sort | tail -1)" | sed -E 's/^StarFlowTV-(.*)-java32-release\.apk$/\1/')"
          test -n "$version_name"
          declare -A inputs=(
            [armeabi-v7a]="app/build/outputs/apk/java32/release/StarFlowTV-$version_name-java32-release.apk"
            [arm64-v8a]="app/build/outputs/apk/java64/release/StarFlowTV-$version_name-java64-release.apk"
            [universal]="app/build/outputs/apk/java/release/StarFlowTV-$version_name-java-release.apk"
          )
          for abi in armeabi-v7a arm64-v8a universal; do
            input="${inputs[$abi]}"
            aligned="$work/$abi-aligned.apk"
            target="$out/StarFlowTV-$version_name-$abi.apk"
            test -s "$input"
            "$zipalign" -f 4 "$input" "$aligned"
            "$apksigner" sign --ks "$work/release.keystore" --ks-key-alias "$STARFLOW_ANDROID_KEY_ALIAS" \
              --ks-pass env:STARFLOW_ANDROID_KEYSTORE_PASSWORD --key-pass env:STARFLOW_ANDROID_KEY_PASSWORD \
              --out "$target" "$aligned"
            "$apksigner" verify --verbose "$target"
            "$aapt" dump badging "$target" | grep -F "package: name='tv.starflow.player'"
            "$apksigner" verify --print-certs "$target" | tee "$out/$abi-certificates.txt"
          done
          (cd "$out" && sha256sum StarFlowTV-*.apk > SHA256SUMS)

      - name: Generate OTA manifest and Ed25519 signature
        env:
          STARFLOW_ED25519_PRIVATE_KEY_B64: ${{ secrets.STARFLOW_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/release-bundle"
          install -d -m 0700 "$bundle"
          cp signed-apks/StarFlowTV-*.apk signed-apks/*-certificates.txt signed-apks/SHA256SUMS "$bundle"/
          curl --fail --retry 3 --silent --show-error \
            https://config.yuying.beauty/starflow/config/manifest.json \
            --output "$bundle/manifest.json"
          version_name="$(sed -E 's/^StarFlowTV-([0-9.]+)-armeabi-v7a\.apk$/\1/' < <(find signed-apks -maxdepth 1 -type f -name 'StarFlowTV-*-armeabi-v7a.apk' -printf '%f\n' | sort | tail -1))"
          version_code="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)"
          certificate_digest="$(sed -n 's/.*certificate SHA-256 digest: //p' signed-apks/armeabi-v7a-certificates.txt | head -1)"
          expected_public_key="$(sed -n "s/.*starflowSigningPublicKey = project.findProperty('starflowSigningPublicKey') ?: '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          expected_key_id="$(sed -n "s/.*starflowSigningKeyId = project.findProperty('starflowSigningKeyId') ?: '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$version_name"
          test -n "$version_code"
          test -n "$certificate_digest"
          test -n "$expected_public_key"
          test -n "$expected_key_id"
          python3 - "$bundle" "$version_name" "$version_code" "$certificate_digest" "$expected_public_key" "$expected_key_id" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          bundle = Path(sys.argv[1])
          version_name = sys.argv[2]
          version_code = int(sys.argv[3])
          certificate_digest = sys.argv[4]
          expected_public_key = sys.argv[5]
          signing_key_id = sys.argv[6]
          key_bytes = base64.b64decode(os.environ["STARFLOW_ED25519_PRIVATE_KEY_B64"])
          private_key = None
          loaders = [serialization.load_der_private_key, serialization.load_pem_private_key]
          load_ssh_private_key = getattr(serialization, "load_ssh_private_key", None)
          if load_ssh_private_key is not None:
              loaders.append(load_ssh_private_key)
          for loader in loaders:
              try:
                  candidate = loader(key_bytes, password=None)
                  if isinstance(candidate, Ed25519PrivateKey):
                      private_key = candidate
                      break
              except (ValueError, TypeError):
                  pass
          if private_key is None and len(key_bytes) == 32:
              private_key = Ed25519PrivateKey.from_private_bytes(key_bytes)
          if private_key is None:
              raise SystemExit("STARFLOW_ED25519_PRIVATE_KEY_B64 is not a supported Ed25519 private key")
          actual_public_key = base64.b64encode(private_key.public_key().public_bytes(
              serialization.Encoding.Raw, serialization.PublicFormat.Raw)).decode("ascii")
          if actual_public_key != expected_public_key:
              raise SystemExit("Ed25519 private key does not match the client public key")

          published_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          config_path = bundle / "manifest.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if not isinstance(config.get("files"), list) or not config["files"]:
              raise SystemExit("remote config manifest has no files")
          config["configVersion"] = max(int(config.get("configVersion", 0)) + 1, 7)
          config["publishedAt"] = published_at
          config["signatureAlgorithm"] = "Ed25519"
          config["signatureStatus"] = "ready"
          config["keyId"] = signing_key_id
          config_payload = (json.dumps(config, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          config_path.write_bytes(config_payload)
          (bundle / "manifest.sig").write_text(
              base64.b64encode(private_key.sign(config_payload)).decode("ascii") + "\n",
              encoding="ascii",
          )
          (bundle / "manifest.sha256").write_text(
              hashlib.sha256(config_payload).hexdigest() + "  manifest.json\n",
              encoding="ascii",
          )
          variants = [
              ("armeabi-v7a", f"StarFlowTV-{version_name}-armeabi-v7a.apk"),
              ("arm64-v8a", f"StarFlowTV-{version_name}-arm64-v8a.apk"),
              ("universal", f"StarFlowTV-{version_name}-universal.apk"),
          ]
          packages = []
          apk_variants = []
          for abi, filename in variants:
              path = bundle / filename
              sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
              url = f"https://update.yuying.beauty/starflow/update/{filename}"
              common = {
                  "abi": abi,
                  "fileName": filename,
                  "url": url,
                  "downloadUrl": url,
                  "size": path.stat().st_size,
                  "sha256": sha256,
                  "signingCertificateDigest": certificate_digest,
                  "certificateSha256": certificate_digest,
                  "status": "ready",
                  "installable": True,
              }
              packages.append({k: common[k] for k in ("abi", "fileName", "downloadUrl", "certificateSha256", "sha256", "size")})
              apk_variants.append(common)
          manifest = {
              "schemaVersion": 1,
              "versionName": version_name,
              "versionCode": version_code,
              "channel": "stable",
              "releaseNotes": f"StarFlowTV {version_name}：新增官方直播类目和混合播放。",
              "publishedAt": published_at,
              "minimumSdk": 23,
              "minSupportedVersionCode": 1,
              "forceUpdate": False,
              "mandatory": False,
              "packageName": "tv.starflow.player",
              "signingStatus": "ready",
              "signingKeyId": signing_key_id,
              "signatureAlgorithm": "Ed25519",
              "keyId": signing_key_id,
              "packages": packages,
              "apkVariants": apk_variants,
          }
          payload = (json.dumps(manifest, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          (bundle / "latest.json").write_bytes(payload)
          (bundle / "latest.sig").write_text(base64.b64encode(private_key.sign(payload)).decode("ascii") + "\n", encoding="ascii")
          (bundle / "latest.sha256").write_text(hashlib.sha256(payload).hexdigest() + "  latest.json\n", encoding="ascii")
          (bundle / "OTA-SHA256SUMS").write_text(
              "".join(
                  f"{hashlib.sha256((bundle / name).read_bytes()).hexdigest()}  {name}\n"
                  for name in ("manifest.json", "manifest.sig", "latest.json", "latest.sig")
              ),
              encoding="ascii",
          )
          for name in ("manifest.json", "manifest.sig", "manifest.sha256", "latest.json", "latest.sig", "latest.sha256", "OTA-SHA256SUMS"):
              (bundle / name).chmod(0o600)
          for path in bundle.glob("*.apk"):
              path.chmod(0o600)
          for path in bundle.glob("*-certificates.txt"):
              path.chmod(0o600)
          (bundle / "SHA256SUMS").chmod(0o600)
          print(f"Generated OTA metadata for {version_name} ({version_code})")
          PY
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          (cd "$bundle" && sha256sum -c OTA-SHA256SUMS)

      - name: Upload signed APKs and public certificate metadata
        uses: actions/upload-artifact@v4
        with:
          name: starflowtv-production-release-${{ github.run_number }}
          retention-days: 14
          path: release-bundle/

      - name: Publish release bundle to 1Panel static HTTPS root
        env:
          STARFLOW_DEPLOY_HOST: ${{ secrets.STARFLOW_DEPLOY_HOST }}
          STARFLOW_DEPLOY_PORT: ${{ secrets.STARFLOW_DEPLOY_PORT }}
          STARFLOW_DEPLOY_USER: ${{ secrets.STARFLOW_DEPLOY_USER }}
          STARFLOW_DEPLOY_KEY: ${{ secrets.STARFLOW_DEPLOY_KEY }}
          STARFLOW_DEPLOY_PATH: ${{ secrets.STARFLOW_DEPLOY_PATH }}
          EXPECTED_HOST_FINGERPRINT: 'SHA256:ApZXBfoZmCk6ziV1udZGaSInz3ZtsxHTdBf7L3LBq+s'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/release-bundle"
          test -s "$bundle/latest.json"
          test -s "$bundle/latest.sig"
          test -s "$bundle/manifest.json"
          test -s "$bundle/manifest.sig"
          test -n "$STARFLOW_DEPLOY_HOST"
          test -n "$STARFLOW_DEPLOY_PORT"
          test -n "$STARFLOW_DEPLOY_USER"
          test -n "$STARFLOW_DEPLOY_KEY"
          test -n "$STARFLOW_DEPLOY_PATH"
          case "$STARFLOW_DEPLOY_PORT" in
            ''|*[!0-9]*) echo 'STARFLOW_DEPLOY_PORT must be numeric'; exit 1 ;;
          esac
          case "$STARFLOW_DEPLOY_PATH" in
            /*) ;;
            *) echo 'STARFLOW_DEPLOY_PATH must be an absolute directory'; exit 1 ;;
          esac
          case "$STARFLOW_DEPLOY_USER" in
            *[!A-Za-z0-9._-]*) echo 'STARFLOW_DEPLOY_USER contains unsupported characters'; exit 1 ;;
          esac
          case "$STARFLOW_DEPLOY_HOST" in
            *[!A-Za-z0-9._:-]*) echo 'STARFLOW_DEPLOY_HOST contains unsupported characters'; exit 1 ;;
          esac

          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          local_stage="$(mktemp -d)"
          trap 'rm -rf "$local_stage" "$key_file" "$known_hosts"' EXIT
          umask 077
          printf '%s\n' "$STARFLOW_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

          scanned_keys="$(ssh-keyscan -4 -T 10 -p "$STARFLOW_DEPLOY_PORT" -t ed25519 "$STARFLOW_DEPLOY_HOST" 2>/dev/null)"
          test -n "$scanned_keys"
          printf '%s\n' "$scanned_keys" > "$known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 { print $2 }')"
          test "$actual_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"

          ssh_opts=(
            -i "$key_file"
            -p "$STARFLOW_DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )
          remote="$STARFLOW_DEPLOY_USER@$STARFLOW_DEPLOY_HOST"
          config_root="${STARFLOW_DEPLOY_PATH%/}"
          case "$config_root" in
            */config.yuying.beauty/index/starflow/config) ;;
            *) echo 'STARFLOW_DEPLOY_PATH must be the config.yuying.beauty StarFlow config directory'; exit 1 ;;
          esac
          update_root="${config_root%/config.yuying.beauty/index/starflow/config}/update.yuying.beauty/index/starflow/update"
          case "$update_root" in
            ''|'/') echo 'derived update deployment path is invalid'; exit 1 ;;
          esac
          config_stage="$config_root/.starflow-release-$GITHUB_RUN_ID"
          update_stage="$update_root/.starflow-release-$GITHUB_RUN_ID"

          install -d -m 0700 "$local_stage/config" "$local_stage/update"
          cp "$bundle/manifest.json" "$bundle/manifest.sig" "$bundle/manifest.sha256" "$local_stage/config/"
          cp "$bundle/latest.json" "$bundle/latest.sig" "$bundle/latest.sha256" "$bundle/OTA-SHA256SUMS" "$local_stage/update/"
          cp "$bundle"/StarFlowTV-*.apk "$local_stage/update/"

          ssh "${ssh_opts[@]}" "$remote" sh -s -- "$config_root" "$config_stage" "$update_root" "$update_stage" <<'REMOTE_PREPARE'
          set -eu
          config_target="$1"
          config_stage="$2"
          update_target="$3"
          update_stage="$4"
          for path in "$config_target" "$update_target"; do
            case "$path" in
              /*) ;;
              *) exit 1 ;;
            esac
            mkdir -p -- "$path"
          done
          mkdir -p -- "$config_stage" "$update_stage"
          chmod 0700 "$config_stage" "$update_stage"
          REMOTE_PREPARE

          scp_opts=(
            -i "$key_file"
            -P "$STARFLOW_DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
          )
          scp "${scp_opts[@]}" -r "$local_stage/config" "$remote:$config_stage/"
          scp "${scp_opts[@]}" -r "$local_stage/update" "$remote:$update_stage/"

          ssh "${ssh_opts[@]}" "$remote" sh -s -- "$config_root" "$config_stage" "$update_root" "$update_stage" <<'REMOTE_PUBLISH'
          set -eu
          config_target="$1"
          config_stage="$2"
          update_target="$3"
          update_stage="$4"
          install -m 0644 "$config_stage/config/manifest.sig" "$config_target/manifest.sig"
          install -m 0644 "$config_stage/config/manifest.sha256" "$config_target/manifest.sha256"
          install -m 0644 "$config_stage/config/manifest.json" "$config_target/manifest.json"
          for file in "$update_stage/update"/*.apk; do
            test -f "$file"
            install -m 0644 "$file" "$update_target/$(basename "$file")"
          done
          install -m 0644 "$update_stage/update/latest.sig" "$update_target/latest.sig"
          install -m 0644 "$update_stage/update/latest.sha256" "$update_target/latest.sha256"
          install -m 0644 "$update_stage/update/OTA-SHA256SUMS" "$update_target/OTA-SHA256SUMS"
          install -m 0644 "$update_stage/update/latest.json" "$update_target/latest.json"
          rm -rf -- "$config_stage" "$update_stage"
          REMOTE_PUBLISH
          echo 'Release bundle published to both static HTTPS roots after host-key and SSH verification.'

      - name: Verify public OTA endpoints
        env:
          STARFLOW_UPDATE_ROOT: https://update.yuying.beauty/starflow/update
          STARFLOW_CONFIG_ROOT: https://config.yuying.beauty/starflow/config
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/release-bundle"
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          for name in latest.json latest.sig; do
            curl --fail --retry 5 --retry-delay 2 --silent --show-error --location \
              "$STARFLOW_UPDATE_ROOT/$name" --output "$probe/$name"
            cmp "$bundle/$name" "$probe/$name"
          done
          for name in manifest.json manifest.sig; do
            curl --fail --retry 5 --retry-delay 2 --silent --show-error --location \
              "$STARFLOW_CONFIG_ROOT/$name" --output "$probe/$name"
            cmp "$bundle/$name" "$probe/$name"
          done
          while IFS= read -r apk_url; do
            test -n "$apk_url"
            curl --fail --retry 5 --retry-delay 2 --silent --show-error --location \
              --head "$apk_url" >/dev/null
          done < <(python3 - "$bundle/latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for package in data["packages"]:
              print(package["downloadUrl"])
          PY
          )
          python3 - "$probe/latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"public_ota_version={data['versionName']} ({data['versionCode']})")
          print(f"public_ota_signing_status={data['signingStatus']}")
          print(f"public_ota_key_id={data['keyId']}")
          PY
